name: Metrics
on:
  schedule: [{cron: "0 */24 * * *"}]
  push: {branches: ["master", "main"]}
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate main metrics badge
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_CI }}
          plugin_lines: yes
          base_indepth: yes
          plugin_licenses: yes
          plugin_isocalendar: yes
          filename: metrics.svg
          plugin_lines_repositories_limit: 100
          plugin_isocalendar_duration: full-year
          repositories_affiliations: owner, collaborator
          # Count commits authored under every email identity as mine
          commits_authoring: artur93gev@gmail.com, arturgevorgyan@picsart.com, artur.gevorgyan@picsart.com, artur@gmail.com, artur93gev@pgmail.com, Artur93gev

      - name: Generate language metrics badge
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_CI }}
          base: ''
          base_indepth: yes
          plugin_languages: yes
          # owner+collaborator so private repos (where the Python lives) are
          # included. indepth mode is intentionally NOT used: its analyzer
          # clones over an unauthenticated URL and silently skips every
          # private repo, so it can never surface private-repo languages.
          # The default (GraphQL linguist) mode reads language bytes via the
          # API, which the token can access for private repos.
          repositories_affiliations: owner, collaborator
          filename: metrics.languages.svg
          plugin_languages_colors: rainbow
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage
          plugin_languages_limit: 8
