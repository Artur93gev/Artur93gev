name: Token debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect METRICS_CI token capabilities
        env:
          TOKEN: ${{ secrets.METRICS_CI }}
        run: |
          echo "== OAuth scopes on the token =="
          curl -sI -H "Authorization: token $TOKEN" https://api.github.com/user \
            | grep -i '^x-oauth-scopes:' || echo "(no x-oauth-scopes header)"

          echo "== Authenticated login =="
          curl -s -H "Authorization: token $TOKEN" https://api.github.com/user \
            | grep -o '"login": *"[^"]*"' || echo "(could not read login)"

          echo "== Private repos the token can see (count + sample) =="
          curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/user/repos?visibility=private&per_page=100&affiliation=owner" \
            > /tmp/priv.json
          echo "count: $(grep -o '"full_name"' /tmp/priv.json | wc -l)"
          grep -o '"full_name": *"[^"]*"' /tmp/priv.json | head -20 || true

          echo "== Can it read trbot (private) directly? =="
          curl -s -o /dev/null -w "trbot HTTP %{http_code}\n" \
            -H "Authorization: token $TOKEN" https://api.github.com/repos/Artur93gev/trbot
